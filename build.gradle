plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.seleniumhq.selenium:selenium-java:4.20.0')
    implementation('org.testng:testng:7.10.2')
    implementation("io.github.bonigarcia:webdrivermanager:6.3.4")
}

test {
    useTestNG()

}